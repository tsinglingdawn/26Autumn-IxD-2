<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>CSs Position Exercise</title>
    <style type="text/css">
      .container{
        border:orange solid;
        position:relative;
      }
      .box1{
        width:100px;
        height:100px;
        background:blue;
      }
      .box2{
        width:100px;
        height:100px;
        background:green;
        border:yellow solid;
        position:relative;
        top:20px;
        left:20px;
      }
      .box3{
        width:100px;
        height:100px;
        background:red;
      }
      .box4{
        width:100px;
        height:100px;
        background:pink;
      }
    </style>
  </head>
<body>
  <div class="container">
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
</div>
</body>
</head>
